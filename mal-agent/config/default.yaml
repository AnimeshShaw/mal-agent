# Model routing. The router always tries local first, escalates to the chosen
# cloud provider only when an escalation trigger fires AND egress policy allows.
models:
  local:
    provider: ollama
    model: qwen2.5-coder:7b
  escalation:
    provider: anthropic        # one of: openai | anthropic | gemini | xai
    model: claude-sonnet-4-6

egress_policy:
  allow_cloud: true
  allow_raw_bytes_egress: false      # hard no
  allow_pseudocode_egress: false     # set true per client only if permitted
  redact_strings: true
  log_all_egress: true

budget:
  max_functions_decompiled: 25
  max_cloud_calls: 10
