<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MAL-AGENT: evidence-grounded, agentic static malware analysis">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e2a3f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- evidence-chain motif: nodes linked to a verdict, echoing the grounding model -->
  <g stroke="#2c3e5a" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 940 70 L 1000 100 L 1000 150 L 940 180 L 880 150 L 880 100 Z"/>
    <path d="M 780 130 L 880 130"/>
    <path d="M 700 90 L 780 130 L 700 170"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="700" cy="90" r="5"/>
    <circle cx="700" cy="170" r="5"/>
    <circle cx="780" cy="130" r="5"/>
  </g>
  <g fill="#34d399">
    <circle cx="940" cy="125" r="7"/>
  </g>
  <text x="940" y="130" font-family="Consolas, 'SF Mono', monospace" font-size="11" fill="#0b1220" text-anchor="middle" font-weight="700">OK</text>

  <text x="70" y="108" font-family="Consolas, 'SF Mono', 'Cascadia Code', monospace" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="1">
    MAL<tspan fill="url(#accent)">-</tspan>AGENT
  </text>
  <text x="72" y="148" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9fb3c8">
    Evidence-grounded, agentic static malware analysis
  </text>

  <g font-family="Consolas, 'SF Mono', monospace" font-size="14" fill="#7d93ad">
    <circle cx="78" cy="196" r="3.5" fill="#34d399"/>
    <text x="90" y="201">deterministic verdicts</text>

    <circle cx="278" cy="196" r="3.5" fill="#38bdf8"/>
    <text x="290" y="201">LLM narrative, never LLM judgment</text>

    <circle cx="560" cy="196" r="3.5" fill="#f59e0b"/>
    <text x="572" y="201">hash-chained audit trail</text>
  </g>
</svg>
