name: Install scripts

# Real end-to-end tests of the actual install scripts users run -- not
# just "does pip install -e . work" (ci.yml already covers that via a
# different path). Two tiers, because they have very different costs:
#
#   quick (install.sh / install.ps1): fast, no large downloads, every
#   push -- this is the path most users take.
#
#   full (install-full.sh / install-full.ps1): downloads Ghidra (~570MB),
#   both evaluated Ollama models (~13GB combined), and the EMBER PE
#   classifier model -- too slow/costly to run on every push. Weekly
#   schedule + manual dispatch instead.

on:
  push:
    branches: [main]
    paths:
      - "scripts/install*.ps1"
      - "scripts/install*.sh"
      - "pyproject.toml"
      - ".github/workflows/install-smoke-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/install*.ps1"
      - "scripts/install*.sh"
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch: {}

jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"

      - name: Run install.sh (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/install.sh

      - name: Run install.ps1 (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/install.ps1

      - name: mal-agent doctor (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m malagent.cli doctor

      - name: mal-agent doctor (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m malagent.cli doctor

      - name: Smoke-analyze a trivial file (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "not a real sample" > /tmp/smoke.txt
          .venv/bin/python -m malagent.cli /tmp/smoke.txt --out /tmp/smoke-out

      - name: Smoke-analyze a trivial file (Windows)
        if: runner.os == 'Windows'
        run: |
          "not a real sample" | Out-File -Encoding ascii smoke.txt
          .venv\Scripts\python.exe -m malagent.cli smoke.txt --out smoke-out

      # The step above exits 0 even if it silently wrote nothing -- this
      # is what actually proves mal-agent produced a real, parseable
      # verdict after a fresh install, not just that the command ran.
      - name: Verify the analysis actually produced a verdict (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -c "
          import glob, json
          assert glob.glob('/tmp/smoke-out/*_report.md'), 'report.md missing'
          assert glob.glob('/tmp/smoke-out/*_report.txt'), 'report.txt missing'
          f = glob.glob('/tmp/smoke-out/*_verdict.json')[0]
          v = json.load(open(f))
          assert 'verdict' in v and 'confidence' in v, f'verdict.json missing expected keys: {v}'
          print('verdict.json OK:', v['verdict'], v['confidence'])
          "

      - name: Verify the analysis actually produced a verdict (Windows)
        if: runner.os == 'Windows'
        run: |
          $report = Get-ChildItem smoke-out -Filter *_report.md
          if (-not $report) { throw "report.md missing" }
          $verdictFile = Get-ChildItem smoke-out -Filter *_verdict.json
          if (-not $verdictFile) { throw "verdict.json missing" }
          $v = Get-Content $verdictFile.FullName -Raw | ConvertFrom-Json
          if (-not $v.verdict -or -not ($v.PSObject.Properties.Name -contains "confidence")) {
            throw "verdict.json missing expected keys"
          }
          Write-Host "verdict.json OK: $($v.verdict) $($v.confidence)"

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Run install-full.sh (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/install-full.sh --yes

      - name: Run install-full.ps1 (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/install-full.ps1 -Yes

      - name: mal-agent doctor (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m malagent.cli doctor

      - name: mal-agent doctor (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m malagent.cli doctor

      # doctor only proves each tool is individually reachable -- this is
      # what proves the full toolchain (capa, Ghidra, Ollama) actually
      # produces a real verdict together, end to end, on a real PE
      # binary (the runner's own python interpreter -- safe, real, always
      # present). --enable-models exercises the LLM reasoning stage too.
      - name: Real end-to-end analysis against a real PE binary (Linux)
        if: runner.os == 'Linux'
        run: |
          PYEXE=$(command -v python3)
          .venv/bin/python -m malagent.cli "$PYEXE" --enable-models --no-cloud --out /tmp/full-out
          python3 -c "
          import glob, json
          f = glob.glob('/tmp/full-out/*_verdict.json')[0]
          v = json.load(open(f))
          assert 'verdict' in v and 'confidence' in v, f'verdict.json missing expected keys: {v}'
          print('full-toolchain verdict.json OK:', v['verdict'], v['confidence'])
          "

      - name: Real end-to-end analysis against a real PE binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $pyExe = (Get-Command python).Source
          .venv\Scripts\python.exe -m malagent.cli $pyExe --enable-models --no-cloud --out full-out
          $verdictFile = Get-ChildItem full-out -Filter *_verdict.json
          if (-not $verdictFile) { throw "verdict.json missing" }
          $v = Get-Content $verdictFile.FullName -Raw | ConvertFrom-Json
          if (-not $v.verdict -or -not ($v.PSObject.Properties.Name -contains "confidence")) {
            throw "verdict.json missing expected keys"
          }
          Write-Host "full-toolchain verdict.json OK: $($v.verdict) $($v.confidence)"
