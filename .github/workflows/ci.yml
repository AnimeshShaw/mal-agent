name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        # Must include 'web': pytest collects web/backend/tests/ too, and
        # those import fastapi/uvicorn at module level. This was silently
        # missing before -- every web-backend test had been failing in CI
        # (not locally, where a dev venv already had fastapi installed for
        # other reasons) since the web UI's test suite was first added.
        run: python -m pip install --upgrade pip && pip install -e ".[full,dev,web]"

      - name: Run test suite
        run: pytest -q
