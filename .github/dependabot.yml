version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # signify is deliberately pinned at 0.7.1, not stale: the release
      # that fixes this package's known CVE (0.9.2) also renamed the
      # class thrember/EMBER2024 imports, and thrember's upstream still
      # uses the old name. There is currently no release that is both
      # patched and compatible -- see pyproject.toml's comment on this
      # exact pin and docs/FEATURES.md's EMBER section. A version-bump
      # PR for this specific package will always be closed; this stops
      # Dependabot from reopening it every week. The underlying
      # vulnerability alert itself stays open and visible, not dismissed.
      - dependency-name: "signify"

  - package-ecosystem: npm
    directory: "/web/frontend"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
