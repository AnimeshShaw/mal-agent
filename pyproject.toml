[project]
name = "mal-agent"
version = "0.1.0"
description = "Evidence-grounded, agentic static malware analysis. Every verdict traces to tool evidence; nothing is guessed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["malware-analysis", "security", "reverse-engineering", "capa", "ghidra", "yara", "llm-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/AnimeshShaw/mal-agent"
Documentation = "https://github.com/AnimeshShaw/mal-agent/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/AnimeshShaw/mal-agent/issues"

[project.optional-dependencies]
full = [
  "pefile>=2023.2.7",
  "pyelftools>=0.31",
  "yara-python>=4.5",
  "pycdlib>=1.14",
  "oletools>=0.60",       # Office/RTF macro triage (BSD)
  "LnkParse3>=1.3",       # Windows shortcut triage (MIT)
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "requests>=2.31",
  # EMBER2024's classifier package isn't on PyPI -- installed directly
  # from its source repo (see docs/ML_CLASSIFIER_PLAN.md Phase 3).
  # signify is pinned EXACTLY, and KNOWINGLY left on a version with an
  # open high-severity CVE (GHSA covering signify < 0.9.2, privilege
  # escalation via signed_data.py/context.py): thrember's features.py
  # (confirmed against its current upstream `main`, not just this
  # pinned version) does `from signify.authenticode import
  # SignedPEFile` -- a class 0.9.2's own fix renamed to AuthenticodeFile.
  # There is no signify release that is both patched and compatible;
  # 0.9.2 is the *first* patched release and already carries the
  # rename. Upgrading breaks every EMBER-enabled install outright
  # (ImportError at module load); staying pinned carries the CVE.
  # Taking the documented risk deliberately rather than silently --
  # EMBER is an opt-in extra (EMBER_MODEL_PATH must be explicitly set),
  # not loaded by a default install, and the vulnerable code path is
  # Authenticode *signature* parsing specifically, not sample execution.
  # Re-pin to a real release the moment thrember's upstream fixes this
  # import; tracked as an open Dependabot alert rather than dismissed,
  # so it stays visible until that happens.
  "thrember @ git+https://github.com/FutureComputing4AI/EMBER2024.git",
  "signify==0.7.1",
]
providers = [
  "openai>=1.0",
  "anthropic>=0.34",
  "google-generativeai>=0.7",
]
ghidra = [
  # Drives Ghidra's Java API in-process (M2). Also needs a Ghidra install
  # itself (GHIDRA_HOME) and, for capa-ranked function selection, capa's
  # rules/sigs -- see README "Turn on more" and .env.example.
  "pyghidra>=3.0",
]
floss = [
  # Deobfuscated string extraction (stack/tight/decoded strings) for
  # native PE samples -- see floss_tool.py's own docstring for scope
  # limits (no .NET support, size-capped). Needs a C compiler toolchain
  # to build its binary2strings dependency (Microsoft C++ Build Tools on
  # Windows) -- not a pure-Python install.
  "flare-floss>=3.1",
]
dev = ["pytest>=8.0"]
web = [
  # Backend for `mal-agent web` (docs/TODO.md Phase 8) -- web/backend/
  # is a separate sibling package (see malagent/web_cli.py), not part of
  # the malagent distribution, so these are only pulled in when this
  # extra is requested. python-multipart is required by FastAPI's
  # Form(...)/UploadFile handling (file uploads + form fields on
  # POST /api/analyses), not optional despite not being imported directly.
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]
docs = [
  # Builds the GitHub Pages site (mkdocs.yml, docs/) -- not needed to
  # use mal-agent itself, only to build/preview the documentation site.
  "mkdocs-material>=9.5",
]

[project.scripts]
mal-agent = "malagent.cli:main"

[tool.setuptools.packages.find]
include = ["malagent*"]
