[project]
name = "mal-agent"
version = "0.1.0"
description = "Evidence-grounded, agentic static malware analysis. Every verdict traces to tool evidence; nothing is guessed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["malware-analysis", "security", "reverse-engineering", "capa", "ghidra", "yara", "llm-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/AnimeshShaw/mal-agent"
Documentation = "https://github.com/AnimeshShaw/mal-agent/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/AnimeshShaw/mal-agent/issues"

[project.optional-dependencies]
full = [
  "pefile>=2023.2.7",
  "pyelftools>=0.31",
  "yara-python>=4.5",
  "pycdlib>=1.14",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "langgraph>=0.2",
  "requests>=2.31",
  # EMBER2024's classifier package isn't on PyPI -- installed directly
  # from its source repo (see docs/ML_CLASSIFIER_PLAN.md Phase 3).
  # signify is pinned EXACTLY: thrember pins signify>=0.7.1 with no
  # upper bound, so a plain pip resolve pulls the latest release, which
  # renamed the SignedPEFile class thrember imports -- a real
  # dependency-drift bug found live during setup (Phase 0 spike).
  "thrember @ git+https://github.com/FutureComputing4AI/EMBER2024.git",
  "signify==0.7.1",
]
providers = [
  "openai>=1.0",
  "anthropic>=0.34",
  "google-generativeai>=0.7",
]
ghidra = [
  # Drives Ghidra's Java API in-process (M2). Also needs a Ghidra install
  # itself (GHIDRA_HOME) and, for capa-ranked function selection, capa's
  # rules/sigs -- see README "Turn on more" and .env.example.
  "pyghidra>=3.0",
]
floss = [
  # Deobfuscated string extraction (stack/tight/decoded strings) for
  # native PE samples -- see floss_tool.py's own docstring for scope
  # limits (no .NET support, size-capped). Needs a C compiler toolchain
  # to build its binary2strings dependency (Microsoft C++ Build Tools on
  # Windows) -- not a pure-Python install.
  "flare-floss>=3.1",
]
dev = ["pytest>=8.0"]

[project.scripts]
mal-agent = "malagent.cli:main"

[tool.setuptools.packages.find]
include = ["malagent*"]
